[project]
name = "shortgen"
version = "0.1.0"
description = "Cut short videos from long event-session recordings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32", "pillow>=10"]

[project.scripts]
shortgen = "shortgen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shortgen*"]
